<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 炒股助手</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
.header { background: #07c160; color: white; padding: 16px; text-align: center; font-size: 18px; }
.chat { flex: 1; overflow-y: auto; padding: 16px; }
.msg { max-width: 80%; margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
.msg.bot { background: white; align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.user { background: #07c160; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
.chat { display: flex; flex-direction: column; }
.input-bar { display: flex; padding: 12px; background: white; border-top: 1px solid #e0e0e0; }
.input-bar input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
.input-bar button { margin-left: 8px; padding: 10px 20px; background: #07c160; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
.input-bar button:disabled { background: #ccc; }
.tips { padding: 8px 16px; background: #fff9e6; font-size: 12px; color: #666; text-align: center; }
</style>
</head>
<body>
<div class="header">📊 AI 炒股助手</div>
<div class="tips">试试：推荐红利股票 | 科技股建议买入的 | 设置 风险:稳健 板块:新能源</div>
<div class="chat" id="chat"></div>
<div class="input-bar">
  <input id="input" type="text" placeholder="输入你的问题..." autocomplete="off">
  <button id="btn" onclick="send()">发送</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const btn = document.getElementById('btn');
const userId = 'user_' + Math.random().toString(36).slice(2, 10);

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

addMsg('欢迎使用 AI 炒股助手！\n\n你可以问我：\n• 推荐红利股票\n• 科技股建议买入的\n• 银行股建议卖出的有吗\n• 设置 风险:稳健 周期:中线 板块:新能源\n• 我的偏好', 'bot');

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  btn.disabled = true;
  addMsg('分析中...', 'bot');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId, message: text })
    });
    const data = await res.json();
    chat.removeChild(chat.lastChild); // 移除"分析中..."
    addMsg(data.reply, 'bot');
  } catch (e) {
    chat.removeChild(chat.lastChild);
    addMsg('网络错误，请稍后再试', 'bot');
  }
  btn.disabled = false;
  input.focus();
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
